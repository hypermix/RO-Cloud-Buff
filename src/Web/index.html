  function nativePaintTimers(){if(state.page!=='cards')return;for(const c of state.cards){if(!c.connected)continue;const card=app.querySelector(`[data-character="${CSS.escape(c.id)}"]`);if(!card)continue;for(const b of c.buffs){if(b.presence!=='active')continue;const row=card.querySelector(`.rb-buff[data-id="${b.id}"]`);if(!row)continue;row.dataset.remaining=b.left;const warning=b.left>0&&b.left<=10;row.classList.toggle('rb-ending',warning);const time=row.querySelector('.rb-time');if(time){const value=b.expiresAt===null?'시간 없음':b.left<=0?'만료 추정':format(Math.ceil(b.left));if(time.firstChild?.nodeType===Node.TEXT_NODE){if(time.firstChild.nodeValue!==value)time.firstChild.nodeValue=value;}else time.prepend(document.createTextNode(value));let note=time.querySelector('small');if(warning&&!note){note=document.createElement('small');note.textContent='종료 임박';time.append(note);}if(!warning&&note)note.remove();}const bar=row.querySelector('.rb-track>span');if(bar)bar.style.width=Math.max(0,Math.min(100,b.left/(def(b.id)?.total||1)*100))+'%';}}}
  function saveLive(){if(saveLiveTimer)return;saveLiveTimer=setTimeout(()=>{saveLiveTimer=null;persist();},5000);}
  function nativeConnectDialog(m,close){return `<div class="rb-dialog-top"><div><h3>게임 창 연결</h3><p>실행 중인 라그나로크 클라이언트를 선택하세요.</p></div>${close}</div><div class="rb-target-launch"><button type="button" class="rb-crosshair" data-action="target-handle" aria-label="과녁을 게임 창으로 끌어 놓기">${icon('crosshair')}</button><span class="rb-sub">과녁을 게임 창 위에 끌어 놓아도 됩니다.</span></div><div class="rb-crosshair-feedback" role="status" aria-live="polite">과녁을 누른 채 게임 창으로 이동하면 대상이 표시됩니다.</div><div class="rb-real-windows">${m.loading?'<p class="rb-sub">게임 창을 확인하는 중…</p>':(m.windows||[]).map(w=>`<button type="button" data-action="target" data-token="${esc(w.token)}" class="cursor-interaction" aria-pressed="${m.selected===w.token}">${icon('app-window')}<span>${esc(w.title||w.process)}<small>PID ${w.pid}</small></span></button>`).join('')||'<p class="rb-sub">실행 중인 게임 창이 없습니다. 게임에 접속한 뒤 새로고침해주세요.</p>'}</div><button type="button" class="rb-secondary cursor-interaction" data-action="refresh-windows">${icon('refresh-cw')}목록 새로고침</button><label class="rb-field">클라이언트 이름<input type="text" data-input="card-name" value="${esc(m.name||'')}" placeholder="메인 캐릭터"></label><p class="rb-code-feedback">${esc(m.error||'')}</p><div class="rb-dialog-actions"><button type="button" class="cursor-interaction" data-action="close">취소</button><button type="button" class="rb-primary cursor-interaction" data-action="connect" ${m.selected?'':'disabled'}>선택한 창 연결</button></div>`;}
  function nativeDiagnostics(card){
   const d=card.captureStats;if(!d||card.connected)return '';const candidates=card.observedCandidates||[],has=candidates.length>0;
   return `<div class="rb-setup"><span class="rb-setup-step">${has?'마지막 단계':'연결 중 · 2 / 3'}</span><h4>${has?'방금 사용한 버프인가요?':'게임에서 버프를 하나 사용해주세요'}</h4><p>${has?'본인에게 적용한 버프가 맞으면 연결 완료를 누르세요.':'이 캐릭터 자신에게 적용되는 스킬이나 버프 아이템이면 됩니다. 기존 버프를 다시 사용해도 괜찮습니다.'}</p>${has?`<div class="rb-actor-candidates">${candidates.map((c,i)=>`<div class="rb-setup-candidate"><span><strong>${esc(def(c.statusId)?.name||('이름을 모르는 버프 · ID '+c.statusId))}</strong><small>${c.leftMs!=null&&c.leftMs!==4294967295?Math.ceil(c.leftMs/1000)+'초 지속':'시간 정보 없음'}${candidates.length>1?' · 후보 '+(i+1):''}</small></span><button type="button" class="rb-primary cursor-interaction" data-action="finish-setup" data-card="${card.id}" data-actor="${c.actorId}">연결 완료</button></div>`).join('')}</div>${candidates.length>1?`<p class="rb-sub">어느 버프인지 모르겠다면 한 번 더 사용해주세요.</p><button type="button" class="rb-secondary cursor-interaction" data-action="narrow-calibration" data-card="${card.id}">다시 사용해서 찾기</button>`:''}`:d.calibrating?'<div class="rb-setup-wait">버프를 기다리고 있습니다…</div>':`<button type="button" class="rb-secondary cursor-interaction" data-action="start-calibration" data-card="${card.id}">다시 기다리기</button>`}<details class="rb-setup-details"><summary>연결 진단</summary><span>캡처 ${d.packets}개 · 수신 ${d.incomingBytes}B · 버프 ${d.statuses}개</span>${candidates.map(c=>`<span>상태 ${c.statusId} · 대상 ${c.actorId}</span>`).join('')}</details></div>`;
  }
  async function refreshNativeWindows(){const m=state.modal;if(m?.type!=='connect')return;m.name=app.querySelector('[data-input="card-name"]')?.value||m.name;m.loading=true;render();try{const result=await roNative.call('windows');if(state.modal!==m)return;m.windows=result;m.selected=null;m.error='';}catch(error){m.error=error.message;}if(state.modal===m){m.loading=false;render();}}
  async function nativeUiAction(action,button,card){
   if(managementAction(action,button))return true;
   if(action==='disconnect-client'){try{await roNative.call('unbind',{cardId:card.id});nativeObserved.delete(card.id);card.connected=false;card.candidate=null;card.selectedActor=null;card.captureStats=null;card.observedCandidates=[];card.actorId=null;card.connectionText='게임 창 연결 대기';for(const b of card.buffs){b.presence='unknown';b.left=0;delete b.expiresAt;delete b.warned;delete b.expiryNotified;}state.menu=null;notify('연결을 해제했습니다. 카드와 버프 설정은 유지됩니다.');persist();}catch(error){notify(error.message);}return true;}
   if(action==='add'||action==='reconnect'){state.menu=null;state.modal={type:'connect',name:card?.name||'',card:card?.id,windows:[]};await refreshNativeWindows();return true;}
   if(action==='refresh-windows'){await refreshNativeWindows();return true;}
   if(action==='target'){state.modal.name=app.querySelector('[data-input="card-name"]').value;state.modal.selected=button.dataset.token;render();return true;}
   if(action==='connect'){const m=state.modal;if(!m.selected)return true;let c=state.cards.find(c=>c.id===m.card),added=false;if(!c){c={id:'client-'+Date.now(),name:'',icon:'swords',connected:false,mode:'normal',pinRequired:false,buffLayout:'list',buffs:state.definitions.map(d=>({id:d.id,left:0,presence:'unknown',order:state.sequence++}))};state.cards.push(c);added=true;}c.name=app.querySelector('[data-input="card-name"]').value.trim()||'클라이언트 '+state.cards.length;try{await roNative.call('bind',{cardId:c.id,token:m.selected});c.connected=false;c.candidate=null;c.captureStats=null;c.observedCandidates=[];c.selectedActor=null;c.connectionText='게임에서 자신에게 버프를 하나 사용해주세요';state.modal=null;render();persist();}catch(error){if(added)state.cards=state.cards.filter(old=>old!==c);m.error=error.message;render();}return true;}
   if(action==='start-calibration'||action==='narrow-calibration'){try{await roNative.call('calibrate',{cardId:card.id,narrow:action==='narrow-calibration'});card.selectedActor=null;card.observedCandidates=[];if(card.captureStats){card.captureStats.calibrating=true;card.captureStats.calibrationUntil=Date.now()+90000;}card.connectionText='게임에서 자신에게 버프를 하나 사용해주세요';render();}catch(error){notify(error.message);}return true;}
   if(action==='finish-setup'){card.selectedActor=Number(button.dataset.actor);action='confirm-actor';}
   if(action==='select-actor'){card.selectedActor=Number(button.dataset.actor);render();return true;}
   if(action==='confirm-actor'){try{await roNative.call('confirm',{cardId:card.id,actorId:card.selectedActor});card.connected=true;card.candidate=null;card.selectedActor=null;card.observedCandidates=[];notify('본인 확인 완료. 이 클라이언트의 버프를 추적합니다.');persist();}catch(error){notify(error.message);}return true;}
   return false;
  }
  window.addEventListener('ro-native',event=>{
   const {type,data}=event.detail;if(type==='windowPin'){state.pin=!!data.enabled;render();persist();return;}if(type==='crosshair'){const hint=app.querySelector('.rb-crosshair-feedback');if(hint)hint.textContent=data.label;return;}const c=state.cards.find(c=>c.id===data?.cardId);if(!c)return;
   if(type==='diagnostics'){c.captureStats=data;const candidateKey=v=>v.actorId+":"+v.statusId;const incoming=data.candidates||[],current=new Map(incoming.map(v=>[candidateKey(v),v]));c.observedCandidates=[...(c.observedCandidates||[]).filter(v=>current.has(candidateKey(v))).map(v=>current.get(candidateKey(v))),...incoming.filter(v=>!(c.observedCandidates||[]).some(old=>candidateKey(old)===candidateKey(v)))];if(c.selectedActor&&!c.observedCandidates.some(v=>v.actorId===c.selectedActor))c.selectedActor=null;if(!c.connected&&state.page==='cards')nativeRefresh();return;}
   if(type==='status'){c.connected=data.connected;c.connectionText=data.status;if(data.reset){nativeObserved.delete(c.id);c.candidate=null;c.observedCandidates=[];c.selectedActor=null;for(const b of c.buffs){b.presence='unknown';b.left=0;delete b.expiresAt;}c.actorId=null;}if(data.actorId)c.actorId=data.actorId;nativeRefresh();return;}
   if(type==='candidate'){c.candidate=data.actorId;c.connectionText='방금 이 캐릭터 자신에게 버프를 사용했다면 본인 확인';nativeRefresh();return;}
   if(type==='buff'){
    if(!nativeObserved.has(c.id))nativeObserved.set(c.id,new Map());nativeObserved.get(c.id).set(data.statusId,{...data});
    let d=def(data.statusId);if(!d&&!state.ignoredIds.includes(data.statusId)&&data.active){let found=state.discoveries.find(v=>v.id===data.statusId);if(!found){found={id:data.statusId,total:0,count:0,time:'방금'};state.discoveries.push(found);}found.total=(data.totalMs??data.leftMs??0)/1000;const count=Math.min(100,(sessionDiscoveryCounts.get(data.statusId)||0)+1);sessionDiscoveryCounts.set(data.statusId,count);found.count=count;found.cardId=c.id;found.firstReceivedAt??=data.time;found.lastReceivedAt=data.time;saveLive();}
    if(d){if(data.totalMs!=null&&data.totalMs!==4294967295&&data.totalMs>0)d.total=data.totalMs/1000;let b=c.buffs.find(b=>b.id===data.statusId);if(!b){b={id:data.statusId,hidden:false,alert:true,remember:false,warning:10};c.buffs.push(b);}if(data.active){b.expiryNotified=false;b.presence='active';b.left=data.leftMs!=null&&data.leftMs!==4294967295?data.leftMs/1000:0;b.expiresAt=data.leftMs!=null&&data.leftMs!==4294967295?data.time+data.leftMs:null;b.order=state.sequence++;b.warned=false;if(b.expiresAt&&b.expiresAt<=Date.now())b.expiryNotified=true;}else{const wasActive=b.presence==='active';b.presence='absent';b.left=0;b.expiresAt=null;if(wasActive&&!b.expiryNotified)playBuffAlert(b);b.expiryNotified=true;}saveLive();}
    nativePaintNav();
    if(d){if(state.page==='cards'&&!nativePaintCardBuff(c,data.statusId))nativeRefresh();else if(state.page==='dictionary'){const duration=app.querySelector(`[data-action="definition"][data-id="${data.statusId}"]`)?.closest('.rb-dict-row')?.querySelector('.rb-dict-duration');if(duration?.firstChild?.nodeType===Node.TEXT_NODE)duration.firstChild.nodeValue=d.total;}}
    else if(state.page==='discover'&&!managementIgnored&&!state.ignoredIds.includes(data.statusId)&&data.active&&!nativePaintDiscovery(data.statusId))nativeRefresh();
   }
  });
  setInterval(()=>{let timing=false;for(const c of state.cards){if(!c.connected)continue;for(const b of c.buffs){if(b.presence!=='active'||!b.expiresAt)continue;timing=true;b.left=Math.max(0,(b.expiresAt-Date.now())/1000);if(b.left===0&&!b.expiryNotified){b.expiryNotified=true;playBuffAlert(b);}if(!b.warned&&b.left>0&&b.left<=(b.warning??10)){b.warned=true;playBuffAlert(b);}}}if(timing)nativePaintTimers();if(nativeDirty)nativeRefresh();},500);
  roNative.call('pin',{enabled:!!state.pin}).catch(()=>{});queueMicrotask(()=>persist());

  queueMicrotask(()=>roNative.call('uiReady').catch(()=>{}));
  app.addEventListener('wheel',event=>{
   if(event.ctrlKey||event.defaultPrevented||Math.abs(event.deltaX)>Math.abs(event.deltaY))return;
   const board=event.target.closest('.rb-cards[data-arrangement="horizontal"]');
   if(!board||board.scrollWidth<=board.clientWidth||!event.deltaY)return;
   for(let node=event.target;node&&node!==board;node=node.parentElement){
    const overflow=getComputedStyle(node).overflowY;
    if(/auto|scroll/.test(overflow)&&node.scrollHeight>node.clientHeight+1&&
      (event.deltaY>0?node.scrollTop+node.clientHeight<node.scrollHeight-1:node.scrollTop>1))return;
   }
   const step=event.deltaMode===1?32:event.deltaMode===2?board.clientWidth:1;
   board.scrollLeft+=event.deltaY*step;event.preventDefault();
  },{passive:false});

  instance.render=render;
  render();
  if(globalThis.Tweak){
   const design={radius:12,gap:16};
   const tweak=new Tweak({container:app,onChange:()=>{app.style.setProperty('--rb-radius',design.radius+'px');app.style.setProperty('--rb-gap',design.gap+'px');}});
   tweak.addSlider(design,'radius',{label:'카드 모서리',min:6,max:24,unit:'px'});
   tweak.addSlider(design,'gap',{label:'카드 사이 간격',min:12,max:28,unit:'px'});
  }
 }
 window.addEventListener('openai:set_globals',event=>{
  const snapshot=event.detail?.globals?.widgetState;
  if(snapshot?.privateContent?.version!==1)return;
  for(const instance of instances){
   if(instance.interacted)continue;
   const restored=snapshot.privateContent.variants?.find(v=>v.layout===instance.layout)?.state;
   if(!restored)continue;
   Object.assign(instance.state,clone(restored),{modal:null,menu:null,notice:'',dragging:false});instance.normalize();instance.render();
  }
 });
})();
</script>
